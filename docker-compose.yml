# docker-compose.yml — Memex: Personal RAG backend services
#
# MCP server runs locally (not in Docker) for direct file access.
# See: uv run memex
#
# Usage:
#   ./setup.sh                    # one-command bootstrap
#   docker compose up -d          # start backend services
#   docker compose down           # stop everything
#
# Custom models via env:
#   EMBED_MODEL=bge-m3 CHAT_MODEL=qwen2.5:0.5b docker compose up -d

services:
  # ── Qdrant vector database ──────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.18
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Ollama (embeddings + chat LLM) ──────────────────────────────────────
  ollama:
    image: ollama/ollama:0.32.4
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_HOST: 0.0.0.0
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 2G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Docling document conversion ─────────────────────────────────────────
  docling:
    image: ghcr.io/docling-project/docling-serve-cu130:v1.27.0
    ports:
      - "${DOCLING_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_HOST: "0.0.0.0"
      DOCLING_SERVE_PORT: "5001"
      NVIDIA_VISIBLE_DEVICES: all
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "0.5"
          memory: 2G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── MCP Server runs locally (not in Docker) ────────────────────────────
  #   uv run memex        # start MCP server locally

  # ── ML Services (sparse BM25 + cross-encoder reranker) ──────────────────
  ml-services:
    build:
      context: .
      dockerfile: Dockerfile
      target: ml
    ports:
      - "${ML_SERVICES_PORT:-5002}:5002"
    environment:
      SPARSE_MODEL: "${SPARSE_MODEL:-Qdrant/bm25}"
      RERANK_MODEL: "${RERANK_MODEL:-BAAI/bge-reranker-base}"
      NVIDIA_VISIBLE_DEVICES: all
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis (caching layer) ──────────────────────────────────────────────
  redis:
    image: redis:7.4.10-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - backend
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  qdrant_data:   # persists vector database (all indexed documents)
  ollama_data:   # persists downloaded models (multi-GB, avoid re-download)
  redis_data:    # persists cache (avoid cold-start on restart)
