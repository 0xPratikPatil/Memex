# ────────────────────────────────────────────────────────────────────────────────
# Memex — Personal RAG backend services (4 containers)
#
# The MCP server runs on the host (uv run memex), not in Docker.
# All services bind to 127.0.0.1 — only accessible from the host machine.
#
# Quick start:
#   ./setup.sh                          # one-command bootstrap
#   docker compose up -d                # start all backend services
#   docker compose down                 # stop everything
#   docker compose down -v              # stop + remove persisted data
#
# Docker best practices: DOCKER.md and AGENTS.md#docker-best-practices
#
# Customize models in config.yaml. Env vars override for ad-hoc runs:
#   EMBED_MODEL=qwen3-embedding:0.6b CHAT_MODEL=qwen2.5:1.5b ./setup.sh
# ────────────────────────────────────────────────────────────────────────────────

name: memex

services:
  # ══════════════════════════════════════════════════════════════════════════════
  # Qdrant — Vector database (semantic search index, 1024d HNSW)
  # ══════════════════════════════════════════════════════════════════════════════
  qdrant:
    image: qdrant/qdrant:v1.18
    container_name: memex-qdrant
    init: true
    command:
      - "./entrypoint.sh"
      - "--uri"
      - "http://localhost:6333"
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    tmpfs:
      - /tmp:exec,size=64M
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    networks:
      - backend
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.memex.service=qdrant"
      - "com.memex.description=Vector database with HNSW index for semantic search"

  # ══════════════════════════════════════════════════════════════════════════════
  # Ollama — Local LLM inference (embeddings + chat, Docker-only, never on host)
  # ══════════════════════════════════════════════════════════════════════════════
  ollama:
    image: ollama/ollama:0.32.4
    container_name: memex-ollama
    init: true
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    tmpfs:
      - /tmp:exec,size=256M
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: 4
      OLLAMA_MAX_LOADED_MODELS: 2
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 2G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.memex.service=ollama"
      - "com.memex.description=LLM inference for embeddings (qwen3-embedding) and chat (qwen2.5)"

  # ══════════════════════════════════════════════════════════════════════════════
  # Marker — Document parsing & conversion (PDF → Markdown, Surya OCR + layout)
  # Replaces Docling: faster (2.9-7.4 pg/s vs 2.1) and higher quality (76 vs 50
  # on olmocr-bench) on GPU. Models pre-cached at build time.
  # ══════════════════════════════════════════════════════════════════════════════
  marker:
    build:
      context: .
      dockerfile: servers/marker/marker.Dockerfile
      target: runtime
      # Model pre-cache downloads from models.datalab.to at build time — host
      # networking so DNS works (host systemd-resolved stub 127.0.0.53 is
      # unreachable inside the default build network).
      network: host
    image: memex-marker:latest
    container_name: memex-marker
    init: true
    ports:
      - "127.0.0.1:${MARKER_PORT:-5001}:5001"
    tmpfs:
      # Surya downloads models via temp dirs under /tmp — needs room for a
      # 1.35GB model.safetensors. 4G covers the largest single model.
      - /tmp:exec,size=4G
    environment:
      # 8GB GPU is shared with Ollama + desktop (Brave) — not enough to hold
      # GPU-only conversion. The 5 models (~3.4GB on disk) load into the
      # per-job subprocess on CUDA and are freed when it exits. The job
      # architecture isolates any crash/OOM from the server.
      TORCH_DEVICE: "cuda"
      # expandable_segments:True uses mmap which causes premature OOM on 8GB
      # GPUs — the allocator fails to find contiguous虚拟address space even
      # when total free VRAM is sufficient. Disabled for small-GPU compat.
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:False"
      NVIDIA_VISIBLE_DEVICES: all
      # Surya caches models under $HOME/.cache — keep HOME=/app so the
      # pre-cached build models are found (no runtime re-download).
      HOME: "/app"
      # Match OMP threads to the CPU limit (4) — over-threading thrashes.
      OMP_NUM_THREADS: "4"
      # Hard per-job timeout — a runaway conversion is killed, not hung.
      JOB_TIMEOUT: "${JOB_TIMEOUT:-600}"
      # One subprocess at a time (each loads ~5-6GB of models + GPU VRAM).
      MAX_CONCURRENT_JOBS: "1"
    # Host uses systemd-resolved stub (127.0.0.53) which is unreachable inside
    # the container network namespace — point at a real resolver so marker can
    # download its models from models.datalab.to.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "8.0"
          # Server is thin (~100MB); the per-job subprocess loads ~5.4GB of
          # models + working set for large PDFs. 16G fits conversions of
          # 100MB+ books on cloud instances (32-64G RAM typical).
          memory: "${MARKER_MEM_LIMIT:-16G}"
        reservations:
          cpus: "1.0"
          memory: 4G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.memex.service=marker"
      - "com.memex.description=Document parsing and conversion (Marker + Surya OCR)"

  # ══════════════════════════════════════════════════════════════════════════════
  # MarkItDown — Lightweight document conversion (CPU-only, no GPU)
  # Converts PDF, DOCX, PPTX, XLSX, HTML, EPUB, images, audio, CSV, JSON, ZIP
  # to Markdown. Alternative to Marker for simple documents and Office files.
  # ══════════════════════════════════════════════════════════════════════════════
  markitdown:
    build:
      context: .
      dockerfile: servers/markitdown/markitdown.Dockerfile
    container_name: memex-markitdown
    init: true
    ports:
      - "127.0.0.1:${MARKITDOWN_PORT:-5003}:5003"
    tmpfs:
      - /tmp:exec,size=512M
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:5003/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ══════════════════════════════════════════════════════════════════════════════
  # OCR — Multi-model OCR service (RapidOCR + Granite-Docling + LightOnOCR)
  #
  # Two build targets (ocr.Dockerfile):
  #   rapidocr — pp-ocrv6-medium, onnxruntime-gpu (auto CPU/GPU, default)
  #   vlm      — all 3 models, PyTorch + transformers (~8GB)
  #
  # GPU auto-detection: onnxruntime-gpu uses CUDA when available, falls back to
  # CPU automatically. Just mount GPU with NVIDIA Container Toolkit.
  # ══════════════════════════════════════════════════════════════════════════════
  ocr:
    build:
      context: .
      dockerfile: servers/ocr/ocr.Dockerfile
      target: ${OCR_BUILD_TARGET:-rapidocr}
    image: memex-ocr:${OCR_BUILD_TARGET:-rapidocr}
    container_name: memex-ocr
    init: true
    ports:
      - "127.0.0.1:${OCR_PORT:-5004}:5004"
    environment:
      OCR_MODEL: "${OCR_MODEL:-pp-ocrv6-medium}"
      OCR_IDLE_UNLOAD_S: "${OCR_IDLE_UNLOAD_S:-300}"
      NVIDIA_VISIBLE_DEVICES: all
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
    tmpfs:
      - /tmp:exec,size=64M
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5004/health"]
      interval: 30s
      timeout: 10s
      start_period: ${OCR_START_PERIOD:-30s}
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "${OCR_CPU_LIMIT:-2.0}"
          memory: "${OCR_MEM_LIMIT:-4G}"
        reservations:
          cpus: "1.0"
          memory: 2G
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.memex.service=ocr"
      - "com.memex.description=OCR service (pp-ocrv6-medium, auto GPU)"

  # ── Redis — persistent caching layer ──
  redis:
    image: redis:7.4.10-alpine
    container_name: memex-redis
    init: true
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --appendonly yes
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:exec,size=32M
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  # ══════════════════════════════════════════════════════════════════════════════
  # ML Services — Sparse BM25 + reranker (production: Docker, dev: pip)
  # ══════════════════════════════════════════════════════════════════════════════
  ml-services:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: memex-ml
    init: true
    ports:
      - "127.0.0.1:${ML_SERVICES_PORT:-5002}:5002"
    tmpfs:
      - /tmp:exec,size=64M
    environment:
      SPARSE_MODEL: "${SPARSE_MODEL:-Qdrant/bm25}"
      RERANK_MODEL: "${RERANK_MODEL:-Qwen/Qwen3-Reranker-0.6B}"
      RERANK_MODEL_FALLBACK: "${RERANK_MODEL_FALLBACK:-BAAI/bge-reranker-base}"
      RERANK_TYPE: "${RERANK_TYPE:-auto}"
      CC: gcc
      CXX: g++
      NVIDIA_VISIBLE_DEVICES: all
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.memex.service=ml-services"
      - "com.memex.description=Sparse BM25 embeddings + causal-LM reranker"


# Networks
# ══════════════════════════════════════════════════════════════════════════════════
networks:
  backend:
    driver: bridge
    # internal: false — MCP server on host needs to reach containers via 127.0.0.1
    internal: false

# ══════════════════════════════════════════════════════════════════════════════════
# Named volumes (persist across container restarts)
# ══════════════════════════════════════════════════════════════════════════════════
volumes:
  qdrant_data:
    name: memex_qdrant_data
  ollama_data:
    name: memex_ollama_data
  redis_data:
    name: memex_redis_data
