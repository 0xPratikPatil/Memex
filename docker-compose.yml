# ────────────────────────────────────────────────────────────────────────────────
# Memex — Personal RAG backend services
#
# The MCP server runs on the host (uv run memex), not in Docker.
# All services bind to 127.0.0.1 — only accessible from the host machine.
#
# Quick start:
#   ./setup.sh                          # one-command bootstrap
#   docker compose up -d                # start all backend services
#   docker compose down                 # stop everything
#   docker compose down -v              # stop + remove persisted data
#
# Docker best practices: DOCKER.md and AGENTS.md#docker-best-practices
#
# Customize models in config.yaml. Env vars override for ad-hoc runs:
#   EMBED_MODEL=qwen3-embedding:0.6b CHAT_MODEL=qwen2.5:1.5b ./setup.sh
# ────────────────────────────────────────────────────────────────────────────────

name: memex

services:
  # ══════════════════════════════════════════════════════════════════════════════
  # Qdrant — Vector database (semantic search index, 1024d HNSW)
  # ══════════════════════════════════════════════════════════════════════════════
  qdrant:
    image: qdrant/qdrant:v1.18
    container_name: memex-qdrant
    init: true
    command:
      - "./entrypoint.sh"
      - "--uri"
      - "http://localhost:6333"
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    tmpfs:
      - /tmp:exec,size=64M
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    networks:
      - backend
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.memex.service=qdrant"
      - "com.memex.description=Vector database with HNSW index for semantic search"

  # ══════════════════════════════════════════════════════════════════════════════
  # Ollama — Local LLM inference (embeddings + chat, Docker-only, never on host)
  # ══════════════════════════════════════════════════════════════════════════════
  ollama:
    image: ollama/ollama:0.32.4
    container_name: memex-ollama
    init: true
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    tmpfs:
      - /tmp:exec,size=256M
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: 4
      OLLAMA_MAX_LOADED_MODELS: 2
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "1.0"
          memory: 2G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.memex.service=ollama"
      - "com.memex.description=LLM inference for embeddings (qwen3-embedding) and chat (qwen2.5)"

  # ══════════════════════════════════════════════════════════════════════════════
  # Docling Serve — Document parsing & conversion (PDF, DOCX, HTML, etc.)
  # ══════════════════════════════════════════════════════════════════════════════
  docling:
    image: ghcr.io/docling-project/docling-serve-cu130:v1.27.0
    container_name: memex-docling
    init: true
    ports:
      - "127.0.0.1:${DOCLING_PORT:-5001}:5001"
    tmpfs:
      - /tmp:exec,size=128M
    environment:
      DOCLING_SERVE_HOST: "0.0.0.0"
      DOCLING_SERVE_PORT: "5001"
      NVIDIA_VISIBLE_DEVICES: all
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6G
        reservations:
          cpus: "0.5"
          memory: 2G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.memex.service=docling"
      - "com.memex.description=Document parsing and hybrid chunking (Docling HybridChunker)"

  # ══════════════════════════════════════════════════════════════════════════════
  # ML Services — Sparse BM25 embeddings + cross-encoder / causal-LM reranker
  # ══════════════════════════════════════════════════════════════════════════════
  ml-services:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: memex-ml
    init: true
    ports:
      - "127.0.0.1:${ML_SERVICES_PORT:-5002}:5002"
    tmpfs:
      - /tmp:exec,size=64M
    environment:
      SPARSE_MODEL: "${SPARSE_MODEL:-Qdrant/bm25}"
      RERANK_MODEL: "${RERANK_MODEL:-Qwen/Qwen3-Reranker-0.6B}"
      RERANK_MODEL_FALLBACK: "${RERANK_MODEL_FALLBACK:-BAAI/bge-reranker-base}"
      RERANK_TYPE: "${RERANK_TYPE:-auto}"
      # Triton CUDA kernel compilation at model load time needs gcc.
      CC: gcc
      CXX: g++
      NVIDIA_VISIBLE_DEVICES: all
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.memex.service=ml-services"
      - "com.memex.description=Sparse BM25 embeddings + causal-LM reranker (Qwen3-Reranker)"

  # ══════════════════════════════════════════════════════════════════════════════
  # Redis — Search + embedding cache (allkeys-lru, 256mb max)
  # ══════════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7.4.10-alpine
    container_name: memex-redis
    init: true
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --appendonly yes
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:exec,size=32M
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.memex.service=redis"
      - "com.memex.description=Search and embedding cache (append-only, allkeys-lru eviction)"

# ══════════════════════════════════════════════════════════════════════════════════
# Networks
# ══════════════════════════════════════════════════════════════════════════════════
networks:
  backend:
    driver: bridge
    # internal: false — MCP server on host needs to reach containers via 127.0.0.1
    internal: false

# ══════════════════════════════════════════════════════════════════════════════════
# Named volumes (persist across container restarts)
# ══════════════════════════════════════════════════════════════════════════════════
volumes:
  qdrant_data:
    name: memex_qdrant_data
  ollama_data:
    name: memex_ollama_data
  redis_data:
    name: memex_redis_data
