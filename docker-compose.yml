# docker-compose.yml — Personal RAG MCP stack
#
# Usage:
#   docker compose up -d
#   docker compose logs -f mcp
#   docker compose down
#
# First run: pull Ollama model
#   docker compose exec ollama ollama pull bge-m3

services:
  # ── Qdrant vector database ──────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Ollama (embedding server) ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.9.6
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Docling document conversion server ─────────────────────────────────
  docling:
    image: ghcr.io/docling-project/docling-serve-cu130:v1.27.0
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_HOST: "0.0.0.0"
      DOCLING_SERVE_PORT: "5001"
      NVIDIA_VISIBLE_DEVICES: all
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Personal RAG MCP Server ────────────────────────────────────────────
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DOCLING_URL: "http://docling:5001/v1/convert/source"
      OLLAMA_EMBED_URL: "http://ollama:11434/api/embeddings"
      QDRANT_URL: "http://qdrant:6333"
      FILE_SERVER_URL: "http://fileserver:9900"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8080"
      MCP_TRANSPORT: "http"
      CHUNK_SIZE: "512"
      CHUNK_OVERLAP: "50"
      CHUNK_STRATEGY: "recursive"
      SEARCH_FUSION: "rrf"
      RERANK_ENABLED: "true"
      ENABLE_OCR: "true"
      NVIDIA_VISIBLE_DEVICES: all
    networks:
      - backend
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      docling:
        condition: service_healthy
      fileserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── File server (serves host files to MCP container) ────────────────────
  fileserver:
    build:
      context: .
      dockerfile: Dockerfile.fileserver
    volumes:
      - /mnt:/mnt:ro
      - /home:/home:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9900/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  qdrant_data:
  ollama_data:
