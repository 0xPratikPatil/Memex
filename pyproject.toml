[project]
name = "memex"
version = "0.5.0"
description = "Memex — Thin MCP server for personal RAG. Models run in Docker; MCP only does HTTP orchestration."
authors = [
    { name = "Pratik" },
]
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27,<1",
    "tenacity>=9,<10",
    "mcp>=1.20,<2",
    "qdrant-client>=1.18,<2",
    "redis>=8,<9",
    "pyyaml>=6,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "pytest-asyncio>=0.25,<1",
    "mypy>=1.15,<2",
    "ruff>=0.16,<1",
    "pre-commit>=4,<5",
    "types-PyYAML>=6,<7",
]
local = [
    "fastembed>=0.4,<1",
    "sentence-transformers>=3,<4",
]
test = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "pytest-asyncio>=0.25,<1",
    "httpx>=0.27,<1",
]
eval = [
    "ragas>=0.2,<1",
    "datasets>=3,<4",
    "langdetect>=1.0.9",
]
[project.scripts]
memex = "memex.cli:app"
memex-mcp = "memex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memex", "rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: marks tests that require live external services (Ollama, Qdrant, etc.)",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "rag/ml_server.py",
    "rag/services/evaluation.py",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "BLE001",   # broad exception catches are intentional for cleanup
    "S110",     # try-except-pass is intentional for cleanup
    "EXE001",   # shebangs are needed for Docker ENTRYPOINT
    "RUF012",   # mutable class attributes are acceptable here
    "RUF015",   # single-element slice is readable enough
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".opencode/*",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]


