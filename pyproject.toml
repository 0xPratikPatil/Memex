[project]
name = "personal-rag-mcp"
version = "0.3.0"
description = "Production MCP server for personal RAG with Docling + Qdrant + Ollama"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "tenacity>=9,<10",
    "mcp>=1.20,<2",
    "qdrant-client>=1.18,<2",
    "fastembed>=0.4,<1",
    "sentence-transformers>=3,<4",
]

[project.scripts]
rag-mcp = "run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "BLE001",   # broad exception catches are intentional for cleanup
    "S110",     # try-except-pass is intentional for cleanup
    "EXE001",   # shebangs are needed for Docker ENTRYPOINT
    "RUF012",   # mutable class attributes are acceptable here
    "RUF015",   # single-element slice is readable enough
]
