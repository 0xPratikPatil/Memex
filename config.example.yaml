version: "1.0"

vectorstore:
  provider: qdrant
  url: "http://localhost:6333"
  collection: memex
  api_key: ${QDRANT_API_KEY}

embedding:
  provider: ollama
  model: qwen3-embedding:0.6b
  fallback_model: bge-m3
  dimensions: 1024
  batch_size: 64
  base_url: "http://localhost:11434"
  api_key: ${OPENAI_API_KEY}

sparse:
  provider: docker                          # docker (ml-services container) | local (fastembed)
  # provider: local                         #   in-process fastembed, slower first load
  model: Qdrant/bm25

llm:
  provider: ollama
  model: qwen2.5:1.5b
  base_url: "http://localhost:11434"
  api_key: ${OPENAI_API_KEY}
  timeout: 300.0                        # per-call timeout for LLM chat (context gen, metadata, answers)
  read_timeout: 60.0                    # max wait for one response body

converter:
  engine: marker                          # marker (recommended) | markitdown (CPU-only, multi-format)
  marker_url: "http://localhost:5001"
  marker_mode: balanced                   # balanced (GPU, highest quality, default) | fast (bulk, 2.5x faster)
  marker_force_ocr: false                 # force OCR on all pages (scanned-only corpora)
  marker_timeout: 300.0                   # seconds per conversion
  max_concurrent: 2                       # cap parallel conversions — keep <= GPU capacity
  # ── MarkItDown (CPU-only alternative — PDF, DOCX, PPTX, XLSX, HTML, EPUB, etc.) ──
  markitdown_url: "http://localhost:5003"
  markitdown_timeout: 30.0                # seconds per conversion
  # ── OCR fallback (PP-OCRv6 small for scanned PDFs that OOM on Marker) ─────
  ocr_fallback: true                       # auto-retry via OCR when Marker OOMs
  ocr_url: "http://localhost:5004"
  ocr_model: pp-ocrv6-small                # pp-ocrv6-small (default) | lightonocr-2-1b
  ocr_timeout: 120.0                       # seconds per conversion
  # ── Legacy Docling settings (only used when engine: docling) ──────────
  docling_url: "http://localhost:5001/v1/convert/source"
  docling_api_key: ${DOCLING_API_KEY}
  docling_timeout: 300.0
  docling_serve_max_sync_wait: 120   # Docling server max wait before 504
  docling_skip_on_timeout: false     # skip files that timeout instead of failing
  docling_poll_interval: 5.0
  docling_max_retries: 4
  docling_retry_backoff: [60.0, 300.0, 1800.0, 7200.0]
  docling_picture_classify: true
  docling_enrich_code: false
  docling_enrich_formula: false
  docling_chart_extract: false
  docling_ocr: true                    # false = ~60% faster, only if no scanned PDFs
  docling_table_structure: true        # false = ~16-24% faster, only if no tables matter
  docling_table_mode: accurate         # accurate | fast (fast = ~16% faster, fewer table cells)
  docling_max_concurrent: 2            # cap parallel conversions — keep <= docling ENG_LOC_NUM_WORKERS
  docling_image_export: embedded
  docling_pdf_backend: "docling_parse"   # docling_parse (recommended) | pypdfium2 | "" (auto)

chunking:
  strategy: recursive                  # recursive (recommended with marker) | fixed | hybrid (docling only)
  size: 1024
  overlap: 128
  min_length: 30
  merge_peers: true
  tokenizer: Qwen/Qwen3-Embedding-0.6B

reranker:
  enabled: true
  provider: docker # docker (ml-services container) | local (pip sentence-transformers)
  model: Qwen/Qwen3-Reranker-0.6B
  fallback_model: BAAI/bge-reranker-base
  type: auto

query_expansion:
  enabled: true
  hyde: true
  query_rewrite: true
  multi_query: true
  multi_query_count: 3
  hyde_model: ""
  multi_query_model: ""
  query_rewrite_model: ""

contextual_retrieval:
  enabled: true
  strategy: summary
  model: ""
  max_tokens: 50
  batch_size: 10
  max_batches: 8                      # cap LLM batches per doc; rest use header fallback

gpu:
  enabled: true                       # enforce marker/ollama VRAM exclusion on small GPUs
  max_wait_s: 120                     # max wait for VRAM to free before proceeding

metadata:
  extraction_enabled: true
  entity_extraction: true
  doc_classification: true
  topic_tagging: true
  language_detection: true
  model: ""
  max_entities_per_chunk: 10
  max_topics_per_chunk: 5

caching:
  enabled: true
  redis_url: "redis://localhost:6379/0"   # persistent cross-restart cache
  # redis_url: ""                            # empty = in-memory only (no Redis)
  ttl_embedding: 86400
  ttl_search: 3600
  ttl_parse: 604800
  ttl_expansion: 21600
  max_memory_mb: 256
  eviction_policy: allkeys-lru

http:
  timeout: 180.0
  max_retries: 3
  retry_backoff: 0.5
  transport_max_retries: 5              # connection-level failures (server restart)
  transport_retry_backoff: 2.0          # exponential backoff base for transport retries

ingestion:
  timeout_parse: 120.0
  timeout_total: 300.0
  max_concurrent_parses: 3
  max_concurrent_sync: 8

qdrant:
  timeout: 30.0
  max_retries: 3

mcp:
  host: 127.0.0.1
  port: 8080
  character_limit: 25000

search:
  top_k: 30
  mode: hybrid
  mmr:
    fetch_k: 20
    lambda_mult: 0.5

sources:
  - type: local
    name: docs
    path: /mnt/documents
    extensions:
      - .pdf
      - .docx
      - .md
    recursive: true

sync:
  auto_delete: true
  dry_run: false

answer:
  enabled: true
  max_context_chars: 12000
  system_prompt: null
  refusal_sentinel: "INSUFFICIENT_CONTEXT"

evaluation:
  enabled: false
  golden_set_path: null
  output_dir: eval_reports
  top_k: 10
  run_ragas: false
  log_timing: false
